<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordQuest</title>
<style>
/* 앱과 같은 어두운 색을 쓴다 (design_system.dart 의 WQColors). */
:root {
  --bg: #1a1a2e;
  --card: #25253e;
  --text: #ffffff;
  --text-secondary: #a0a0b8;
  --mint: #00d2a0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 32px 16px 64px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
    "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}

main {
  max-width: 720px;
  margin: 0 auto;
}

.back { margin: 0 0 24px; font-size: 14px; }
.back a { color: var(--text-secondary); text-decoration: none; }
.back a:hover { color: var(--mint); }

h1 {
  margin: 0 0 8px;
  font-size: 28px;
  letter-spacing: -0.02em;
}

.updated {
  margin: 0 0 32px;
  font-size: 14px;
  color: var(--text-secondary);
}

h2 {
  margin: 32px 0 8px;
  font-size: 17px;
  color: var(--mint);
}

p { margin: 0 0 12px; }

a { color: var(--mint); }

ul { margin: 0 0 12px; padding-left: 20px; }
li { margin-bottom: 6px; }

footer {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid var(--card);
  font-size: 14px;
  color: var(--text-secondary);
}

/* 라이트 모드 브라우저에서도 읽히게 — 배경을 강제하므로 대비만 맞춘다. */
@media (prefers-color-scheme: light) {
  body { background: var(--bg); color: var(--text); }
}
</style>
</head>
<body>
<main>
  <h1>WordQuest</h1>
  <p class="updated">영어 단어를 게임으로 익히는 안드로이드 앱</p>

  <h2>이 앱은</h2>
  <p>격자에서 단어를 찾는 워드서치로 영어 단어를 외웁니다. 회원가입이 없고,
  학습 기록은 기기 안에만 저장됩니다.</p>

  <h2>문서</h2>
  <ul>
    <li><a href="privacy.html">개인정보처리방침</a></li>
    <li><a href="terms.html">이용약관</a></li>
  </ul>

  <h2>문의</h2>
  <p><a href="mailto:daehyung.kim.dev@gmail.com">daehyung.kim.dev@gmail.com</a></p>

  <footer>WordQuest</footer>
</main>
</body>
</html>
